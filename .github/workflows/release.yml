name: release

# Build a universal macOS app and publish a .dmg to a GitHub Release
# whenever a v* tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      # Developer ID signing + notarization. Driven entirely by repo secrets;
      # when they're absent the job falls back to the old unsigned build.
      #   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
      #   MACOS_CERT_PASSWORD   password for that .p12
      #   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_API_KEY_ID / APPLE_API_ISSUER_ID / APPLE_API_KEY_P8
      #                         App Store Connect API key (raw .p8 contents)
      - name: Import signing certificate
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building **unsigned**." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "KOMPASS_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Signed with Developer ID + notarized." >> "$GITHUB_STEP_SUMMARY"

      - name: Build universal app bundle
        run: ./scripts/bundle.sh --universal

      # Notarize + staple the app itself so it passes Gatekeeper offline and
      # when Homebrew copies it out of the dmg.
      - name: Notarize app
        if: steps.sign.outputs.enabled == 'true'
        run: ./scripts/notarize.sh dist/Kompass.app

      - name: Package .dmg
        id: dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          cp -R dist/Kompass.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Kompass-${VER}.dmg"
          hdiutil create -volname "Kompass" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ "${{ steps.sign.outputs.enabled }}" = "true" ]; then
            codesign --force --timestamp --sign "$KOMPASS_SIGN_IDENTITY" "$DMG"
            ./scripts/notarize.sh "$DMG"
          fi
          # Hash only after stapling — stapling writes the ticket into the dmg.
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # Sidecar the digest as its own asset so the in-app updater can verify
          # the download without scraping the release notes.
          printf '%s  %s\n' "$SHA" "$DMG" > "$DMG.sha256"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### Kompass $VER" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          SHA="${{ steps.dmg.outputs.sha }}"
          # Changelog: commits since the previous tag.
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME")"
            RANGE="since $PREV"
          else
            CHANGES="$(git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME")"
            RANGE="initial"
          fi
          {
            echo "## What's changed ($RANGE)"
            echo
            echo "$CHANGES"
            echo
          } > notes.md
          cat >> notes.md <<EOF
          Universal macOS build (Apple Silicon + Intel).

          ### Install
          \`\`\`sh
          brew install --cask erango/tap/kompass
          \`\`\`
          Or download \`$DMG\` below and drag Kompass to Applications.

          \`sha256: $SHA\`
          EOF
          if [ "${{ steps.sign.outputs.enabled }}" != "true" ]; then
            cat >> notes.md <<EOF

          **Unsigned build:** on first launch, right-click the app → **Open**, or run
          \`xattr -dr com.apple.quarantine /Applications/Kompass.app\`.
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "Kompass $GITHUB_REF_NAME" \
            --notes-file notes.md

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VER: ${{ steps.dmg.outputs.ver }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set — skipping tap bump (update Casks/kompass.rb manually)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/erango/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \".*\"/version \"$VER\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/kompass.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kompass $VER"
          git push
          echo "Bumped erango/homebrew-tap to $VER." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
