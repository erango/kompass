name: release

# Build a universal macOS app and publish a .dmg to a GitHub Release
# whenever a v* tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build universal app bundle
        run: ./scripts/bundle.sh --universal

      - name: Package .dmg
        id: dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          cp -R dist/Kompass.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Kompass-${VER}.dmg"
          hdiutil create -volname "Kompass" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # Sidecar the digest as its own asset so the in-app updater can verify
          # the download without scraping the release notes.
          printf '%s  %s\n' "$SHA" "$DMG" > "$DMG.sha256"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### Kompass $VER" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          SHA="${{ steps.dmg.outputs.sha }}"
          # Changelog: commits since the previous tag.
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_REF_NAME")"
            RANGE="since $PREV"
          else
            CHANGES="$(git log --no-merges --pretty='- %s' "$GITHUB_REF_NAME")"
            RANGE="initial"
          fi
          {
            echo "## What's changed ($RANGE)"
            echo
            echo "$CHANGES"
            echo
          } > notes.md
          cat >> notes.md <<EOF
          Universal macOS build (Apple Silicon + Intel).

          ### Install
          \`\`\`sh
          brew install --cask erango/tap/kompass
          \`\`\`
          Or download \`$DMG\` below and drag Kompass to Applications.

          **Unsigned build:** on first launch, right-click the app → **Open**, or run
          \`xattr -dr com.apple.quarantine /Applications/Kompass.app\`.

          \`sha256: $SHA\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "Kompass $GITHUB_REF_NAME" \
            --notes-file notes.md

      - name: Bump Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VER: ${{ steps.dmg.outputs.ver }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set — skipping tap bump (update Casks/kompass.rb manually)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/erango/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/version \".*\"/version \"$VER\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/kompass.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kompass $VER"
          git push
          echo "Bumped erango/homebrew-tap to $VER." >> "$GITHUB_STEP_SUMMARY"
