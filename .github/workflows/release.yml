name: release

# Build a universal macOS app and publish a .dmg to a GitHub Release
# whenever a v* tag is pushed:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Build universal app bundle
        run: ./scripts/bundle.sh --universal

      - name: Package .dmg
        id: dmg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)"
          cp -R dist/Kompass.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="Kompass-${VER}.dmg"
          hdiutil create -volname "Kompass" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### Kompass $VER" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="${{ steps.dmg.outputs.dmg }}"
          SHA="${{ steps.dmg.outputs.sha }}"
          cat > notes.md <<EOF
          Universal macOS build (Apple Silicon + Intel).

          ### Install
          \`\`\`sh
          brew install --cask erango/tap/kompass
          \`\`\`
          Or download \`$DMG\` below and drag Kompass to Applications.

          **Unsigned build:** on first launch, right-click the app → **Open**, or run
          \`xattr -dr com.apple.quarantine /Applications/Kompass.app\`.

          \`sha256: $SHA\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$DMG" \
            --title "Kompass $GITHUB_REF_NAME" \
            --notes-file notes.md
