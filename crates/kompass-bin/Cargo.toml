[package]
name = "kompass-bin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kompass"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.7.9", features = ["desktop"] }
directories = "6.0.0"
futures = "0.3.32"
image = { version = "0.25.10", default-features = false, features = ["png"] }
kompass-core.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSResponder", "NSView"] }
